
name: Build NIZ Camera APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Checking NIZCamera..."
          ls -la NIZCamera
          test -f NIZCamera/gradlew

      - name: Build APK
        working-directory: NIZCamera
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIZ-Camera-APK
          path: NIZCamera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
