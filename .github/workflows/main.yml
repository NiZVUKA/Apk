
name: Build NIZ Camera APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

           - name: Build APK
        run: gradle assembleDebug
        working-directory: ./NIZCamera

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIZ-Camera-debug-apk
          path: NIZCamera/app/build/outputs/apk/debug/*.apk
